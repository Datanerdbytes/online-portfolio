[project]
name = "online-resume-api"
version = "0.0.0"
description = "FastAPI backend for the online resume portfolio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "sqlalchemy>=2.0.36,<2.1.0",
    "alembic>=1.13.3,<1.14.0",
    "psycopg[binary]>=3.2.2,<3.3.0",
    "pydantic-settings>=2.4.0,<2.5.0",
    "python-dotenv>=1.0.1,<1.1.0",
    "pyjwt[crypto]>=2.8.0,<3.0.0",
    "argon2-cffi>=23.1.0,<24.0.0",
    "python-multipart>=0.0.20",
    "httpx>=0.27.2,<0.28.0",
    "pillow>=13.0.0,<14",
]

[dependency-groups]
dev = [
    "ruff>=0.9.8,<0.10.0",
    "mypy>=1.14.1,<2.0.0",
    "detect-secrets>=1.5.0,<2.0.0",
    "pytest>=8.3.3,<8.4.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "httpx>=0.27.2,<0.28.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
]

[build-system]
requires = ["hatchling>=1.13,<1.14"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.vercel]
entrypoint = "app.main:app"
